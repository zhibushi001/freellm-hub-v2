# 持续集成 —— 公开仓库的自动化门禁
#
# 起因: 2026-10-03 连续三处事故 ——
#   1) 代码修了没提交没部署, 线上跑三天前的镜像
#   2) 健康门禁只查 migrations_pending, 漏掉了 modified/orphaned
#   3) buildx builder inactive 导致 docker compose build 静默失败
# 三者的共同根因是「没有自动化门禁」——全靠人记得跑测试、人记住部署、人盯构建输出。
# 本工作流把「改完了吗 / 能编译吗 / 能过测吗 / 能构建镜像吗」变成 push/PR 自动回答的问题。
#
# 验证记录 (2026-10-03 首跑之后的诚实版):
#   - 首跑红了: 22.x 和 24.x 的 e2e 都挂在 /admin/* 404 —— 前端构建排在后端之后,
#     copy-assets 找不到 freellm-hub-client/dist 就静默跳过, src/public/admin 始终没建。
#     此前宣称的「干净 checkout 实测」其实是一份 cp -a 工作区副本, 连 .git 都没有,
#     继承了 gitignored 的 src/public/admin 和 .env, 正好把这个坑盖住。现已把前端构建
#     前置并加显式断言, 并用真 git clone 复验过。
#   - node:sqlite 在 22.23.3 与 24.15.0 上均免 --experimental-sqlite 标志。
#   - docker build job 首跑即绿: Dockerfile 本来就是 client-builder 阶段先于 runtime 阶段。
#
#   告警清单要自己去看, 别信 annotation 条数:
#   GitHub 每个 check run 最多只回 10 条 annotation, 首跑看到的「10 处 no-explicit-any」
#   实际是全仓库 539 处被截断后的样子 —— 差点据此判断「还剩一小撮」。
#   要真实数字必须本地跑 `npx eslint src --ext .ts` 自己数。
#
#   actions/checkout 与 actions/setup-node 用 v7 (v4 还在 Node 20 运行时上,
#   虽然 GitHub 目前强制降到 Node 24 跑所以只是告警, 但等 Node 20 被移除就会变硬错误)。
#
# e2e 测试自起本地服务 (createServer + listen 127.0.0.1), 不依赖任何外部网络或密钥,
# 所以可以在 CI 上直接跑 —— 不需要配 secrets。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines 声明 >=22.5.0; 两个版本都已实测通过
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (backend)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Setup Node (admin client)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: freellm-hub-client/package-lock.json

      - name: Install admin client deps
        working-directory: freellm-hub-client
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # 前端必须先于后端构建: 后端 `npm run build` 末尾跑 scripts/copy-assets.mjs,
      # 它把 freellm-hub-client/dist/ 同步到 src/public/admin/ (gitignored, 服务从那里静态托管)。
      # 顺序反了 copy-assets 找不到源就跳过, src/public/admin 始终建不出来, /admin/* 全 404。
      - name: Build admin client
        working-directory: freellm-hub-client
        run: npm run build

      - name: Build backend
        run: npm run build

      # 显式断言产物到位。失败信息直接指路, 而不是让 e2e 报两个看不懂的 404。
      - name: Assert admin frontend in place
        run: |
          test -f src/public/admin/index.html || { echo "::error::src/public/admin 缺失 — 确认 Build admin client 在 Build backend 之前"; exit 1; }

      # Lint 是「只减不增」的棘轮, 不是全绿门禁。
      # 全仓库现存 526 处 @typescript-eslint/no-explicit-any, 一次性还清是个大工程,
      # 所以这里把上限钉死在今天的水位: 只要不新增 any 就绿, 新增一处就红。
      # 还清一批就调低 package.json 里 lint:ci 的 --max-warnings 数字, 让它单调下降。
      - name: "Lint (棘轮 - 不允许新增 any)"
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests (自起服务, 无外部依赖)
        run: npm run test:e2e

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 scripts/deploy.sh 相同的 build args, 保证 CI 构建的镜像与线上镜像同构
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} .
