# FreeLLM Hub · docker compose 部署 — 默认值开箱即用 (端口 3030)
# 需要自定义端口/备份目录: cp .env.example .env (.env 不会进 git)
services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit 国内镜像加速 (镜像源优先级: fnnas > dockerproxy > 1ms > daocloud)
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: freellm-hub-v2:latest
    container_name: freellm-hub
    restart: unless-stopped
    ports:
      # 宿主机端口默认 3030, 可在 .env 用 HUB_HOST_PORT 覆盖
      - "${HUB_HOST_PORT:-3030}:3030"
    # named volume 存数据库/密钥/会话; 首次使用先: docker volume create freellm-hub-data
    volumes:
      - freellm-hub-data:/app/data
      # 备份放数据卷之外的宿主机目录 (卷丢不影响备份); 路径可用 .env 的 HUB_BACKUP_DIR_HOST 覆盖
      - ${HUB_BACKUP_DIR_HOST:-./hub-backups}:/app/backups
    environment:
      - HUB_BACKUP_DIR=/app/backups
      - HUB_PORT=3030
      - HUB_HOST=0.0.0.0
      - HUB_PUBLIC_URL=
      - HUB_DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Shanghai}
      # 不设 NODE_ENV: 容器当前日志是 pino-pretty 人类可读格式, 设了 production 会变 JSON
      - LOG_LEVEL=info
    # 镜像内置 node http 健康检查 (镜像里没有 curl, 这里不覆盖)
    # Docker stop 默认 grace 10s 不够等在途请求, compose 重建时给足60s
    stop_grace_period: 60s

volumes:
  # external: 首次使用先 docker volume create freellm-hub-data;
  # 同时防止 compose 给卷名加项目前缀 (裸名会指向一个空的新卷)
  freellm-hub-data:
    external: true
